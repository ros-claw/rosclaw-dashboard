[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosclaw-dashboard"
version = "1.0.0"
description = "Full-featured ROSClaw Dashboard — Next.js frontend + FastAPI backend"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ROSClaw Team", email = "ai@rosclaw.io"},
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "websockets>=14.1",
    "duckdb>=1.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[project.scripts]
rosclaw-dashboard-serve = "rosclaw_dashboard.serve:main"

[project.urls]
Homepage = "https://rosclaw.io"
Repository = "https://github.com/ros-claw/rosclaw-dashboard"

[tool.hatch.build.targets.wheel]
packages = ["src/rosclaw_dashboard"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/rosclaw_dashboard",
    "/tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
